# Both agents read the sales count before either writes it back.
- run: main
  until: join
- run: A
  until: record
  steps: 1        # A reads sold (0)...
- run: B
  until: record
  steps: 1        # ...and so does B, before A has written
- run: A          # A adds 1 and writes 1
- run: B          # B adds 1 to the 0 it read, and also writes 1
